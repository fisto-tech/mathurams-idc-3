<head>

    <title>Sri Mathurams Medical Engineering | Medical Equipment 3D Catalogue</title>

<meta name="description"
      content="Explore Sri Mathurams Medical Engineering's medical equipment and hospital furniture through our interactive 3D catalogue, featuring hospital cots, ICU beds, Fowler cots, stretchers, trolleys and more.">

<meta name="twitter:card" content="summary_large_image">

<meta name="twitter:title"
      content="Sri Mathurams Medical Engineering | Medical Equipment 3D Catalogue">

<meta name="twitter:description"
      content="Explore hospital cots, ICU beds, Fowler cots, stretchers, trolleys and healthcare furniture through an interactive 3D product catalogue.">

<meta name="twitter:image"
      content="./global assets/Images/logo.svg">
    <link rel="icon" href="./global assets/Images/logo.svg">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        @media screen and (min-width: 992px) {
            body {
                overflow: hidden;
            }
        }

        #content {
            width: 100%;
            margin: 0 auto;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #content.visible {
            visibility: visible;
            opacity: 1;
        }

        #content object {
            width: 100%;
            height: 100%;
            border: none;
            min-height: 90vh;
        }
        /* ==================== FUTURISTIC ORBITAL PRELOADER ==================== */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #053664 0%, #03294D 70%, #011325 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999999999;
            overflow: hidden;
            transition: opacity 0.8s ease-out;
        }

        .loader-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 220px;
            height: 220px;
            margin-bottom: 30px;
        }

        .orbit-spinner {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orbit-ring {
            position: absolute;
            border-radius: 50%;
            box-sizing: border-box;
        }

        .orbit-ring.ring-1 {
            width: 220px;
            height: 220px;
            border: 2px dashed rgba(230, 116, 41, 0.4);
            animation: rotateClockwise 12s linear infinite;
        }

        .orbit-ring.ring-2 {
            width: 180px;
            height: 180px;
            border: 3px solid transparent;
            border-top-color: #00d8f6;
            border-bottom-color: #00d8f6;
            animation: rotateCounterClockwise 6s linear infinite;
        }

        .orbit-ring.ring-3 {
            width: 140px;
            height: 140px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 3px solid #E67429;
            animation: rotateClockwise 3s linear infinite;
        }

        .center-logo {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .center-logo img {
            width: 60px;
            height: auto;
        }

        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounterClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        .loader-text {
            margin-top: 20px;
            text-align: center;
        }

        .loader-text h2 {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #ff9f5e, #E67429, #00d8f6);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 3s linear infinite;
        }

        @keyframes textShine {
            from { background-position: 0% center; }
            to   { background-position: 200% center; }
        }

        .loader-text p {
            font-family: sans-serif;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 15px;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        .loader-text .loader-percent {
            font-family: sans-serif;
            font-size: 18px;
            color: #E67429;
            margin-left: 8px;
            letter-spacing: 0;
        }

        .progress-line {
            margin-top: 20px;
            width: 200px;
            height: 3.5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1px;
            overflow: hidden;
            --progress: 0%;
        }

        .progress-line::after {
            content: '';
            display: block;
            width: var(--progress);
            height: 100%;
            background: linear-gradient(90deg, transparent, #E67429, #00d8f6, transparent);
            transition: width 0.3s ease;
        }

        .fade-out {
            opacity: 0 !important;
            pointer-events: none;
        }
    </style>
</head>

<body >

    <!-- ✅ STEP 1: Preloader is now uncommented and always visible on load -->
    <div id="preloader">
        <div class="loader-wrapper">
            <div class="orbit-spinner">
                <div class="orbit-ring ring-1"></div>
                <div class="orbit-ring ring-2"></div>
                <div class="orbit-ring ring-3"></div>
                <div class="center-logo">
                    <img src="./global assets/Images/logo.svg" alt="Sri Mathurams Medical Engineering Logo">
                </div>
            </div>
        </div>

        <div class="progress-line"></div>
        <div class="loader-text">
            <p>Loading <span class="loader-percent" id="loader-percent">0</span>%</p>
        </div>
    </div>

    <div id="content"></div>

    <script>
        const preloader = document.getElementById("preloader");
        const contentDiv = document.getElementById("content");
        const percentText = document.getElementById("loader-percent");
        const progressLine = document.querySelector(".progress-line");

        let currentProgress = 0;
        let targetProgress = 0;
        let progressFrame = null;
        let contentShown = false;
        let isFinished = false;

        function renderProgress() {
            const displayVal = Math.min(100, Math.max(0, Math.floor(currentProgress)));
            if (percentText) percentText.textContent = `${displayVal}`;
            if (progressLine) progressLine.style.setProperty("--progress", `${displayVal}%`);
        }

        renderProgress();

        function updateProgressLoop() {
            if (contentShown) return;

            if (isFinished) {
                // All images loaded: quickly & smoothly finish orderwise up to 100%
                const step = Math.max(2.5, (100 - currentProgress) * 0.35);
                currentProgress += step;
                if (currentProgress >= 100) {
                    currentProgress = 100;
                    renderProgress();
                    showContent();
                    return;
                }
            } else {
                // Images still loading: fast & smooth orderwise count following image progress
                const effectiveTarget = Math.max(targetProgress, 25);
                if (currentProgress < effectiveTarget) {
                    const diff = effectiveTarget - currentProgress;
                    currentProgress += Math.max(0.8, diff * 0.2);
                } else if (currentProgress < 90) {
                    // Actively & smoothly increase count up to 90% while images finish loading
                    currentProgress += 0.6;
                }
                if (currentProgress > 90) currentProgress = 90;
            }

            renderProgress();
            progressFrame = requestAnimationFrame(updateProgressLoop);
        }

        // Start active tick loop immediately
        progressFrame = requestAnimationFrame(updateProgressLoop);

        function showContent() {
            if (contentShown) return;
            contentShown = true;
            contentDiv.classList.add("visible");
            preloader.classList.add("fade-out");
            setTimeout(() => {
                preloader.style.display = "none";
            }, 800);
        }

        function finishLoading() {
            if (isFinished) return;
            isFinished = true;
            targetProgress = 100;
        }

        function load_home() {
            var folderPath = 'For_Desc/index.html';
            // contentDiv.innerHTML = '<object type="text/html" data="' + folderPath +
            //     '" style="width:100%; height:%; border:none;"></object>';
            const height = window.innerWidth <= 480 ? '90.5vh' : '100vh';

contentDiv.innerHTML = '<object type="text/html" data="' + folderPath +
    '" style="width:100%; height:' + height + '; border:none;"></object>';
            // Safety fallback timer (60 seconds) in case network drops or external dependencies fail to respond
            setTimeout(() => {
                if (!isFinished) {
                    finishLoading();
                }
            }, 60000);
        }

        // ===== MERGED MESSAGE LISTENER (asset progress + contentReady + fullscreen) =====
        window.addEventListener("message", function (event) {
            if (!event.data || !event.data.action) return;

            if (event.data.action === "loadProgress") {
                const rawPercent = Number(event.data.percent);
                if (Number.isFinite(rawPercent)) {
                    // Track actual asset progress up to 90% while images load
                    const mappedTarget = Math.min(90, Math.max(0, Math.round(rawPercent)));
                    if (mappedTarget > targetProgress) {
                        targetProgress = mappedTarget;
                    }
                }
            }

            // Signal from inner flipbook: ALL assets loaded
            if (event.data.action === "contentReady") {
                finishLoading();
            }

            // Fullscreen toggle from inner flipbook
            if (event.data.action === "toggleFullscreen") {
                if (!document.fullscreenElement) {
                    contentDiv.requestFullscreen?.() || contentDiv.webkitRequestFullscreen?.();
                } else {
                    document.exitFullscreen?.();
                }
            }
        });

        window.onload = load_home;

document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' ||
        e.key === 'ArrowDown'  || e.key === 'ArrowUp') {
        e.preventDefault();
    }
    if (e.target.matches('input, textarea')) return;
    const objectEl = document.querySelector('#content object');
    if (!objectEl) return;
    switch(e.key) {
        case 'ArrowRight':
        case 'ArrowDown':
            objectEl.contentWindow.postMessage({ action: 'flipNext' }, '*');
            break;
        case 'ArrowLeft':
        case 'ArrowUp':
            objectEl.contentWindow.postMessage({ action: 'flipPrev' }, '*');
            break;
        case 'Home':
            objectEl.contentWindow.postMessage({ action: 'flipFirst' }, '*');
            break;
        case 'End':
            objectEl.contentWindow.postMessage({ action: 'flipLast' }, '*');
            break;
    }
});
    </script>
</body>
</html>
